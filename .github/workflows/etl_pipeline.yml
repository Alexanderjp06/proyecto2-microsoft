name: ETL Pipeline Automatizado

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Se ejecutará todos los días a la medianoche (UTC)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. Clonar el repositorio
      uses: actions/checkout@v3

    - name: 2. Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. Ejecutar Extracción
      run: |
        echo " [4.1] Iniciando extracción..."
        python -u src/extract.py
        echo " [4.2] Extracción finalizada."

    - name: 5. Ejecutar Transformación
      run: |
        echo " [5.1] Iniciando transformación..."
        python -u src/transform.py
        echo " [5.2] Transformación finalizada."